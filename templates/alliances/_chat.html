<section class="feed-card kb-alliance-chat" data-alliance-chat="{{ alliance.slug }}" data-messages-url="{% url 'alliances:messages' alliance.slug %}" data-presence-url="{% url 'alliances:presence' alliance.slug %}">
  <div class="feed-head">
    <h2>چت اتحاد</h2>
    <span class="kb-alliance-chat__online" data-alliance-online>۰ آنلاین</span>
  </div>
  <div class="kb-alliance-chat__log" id="alliance-chat-log">
    {% for row in messages %}
    <article class="kb-alliance-chat__item" data-msg-id="{{ row.id }}">
      <strong>{{ row.name }}</strong>
      {% if row.text %}<p>{{ row.text }}</p>{% endif %}
      {% if row.gif_url %}
      <span class="kb-gif"><img src="{{ row.gif_preview_url|default:row.gif_url }}" alt="{{ row.alt|default:'GIF' }}" loading="lazy" decoding="async"></span>
      {% endif %}
      {% if row.image_url %}<img src="{{ row.image_url }}" alt="">{% endif %}
    </article>
    {% empty %}
    <p class="profile-copy" data-alliance-empty>هنوز پیامی نیست.</p>
    {% endfor %}
  </div>
  <form class="kb-alliance-chat__form" id="alliance-chat-form" data-kb-composer="chat">
    {% csrf_token %}
    <input type="text" name="text" maxlength="500" autocomplete="off" placeholder="پیام برای هم‌رزمان">
    <label class="kb-alliance-chat__file">
      <input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif">
      <span>عکس</span>
    </label>
    <button class="auth-btn" type="submit">ارسال</button>
  </form>
</section>
