{% load static %}
<div class="landing-scene" aria-hidden="true">
  <div class="landing-rig">
    <div class="landing-bg" data-scene="{% static 'images/background1.png' %}"></div>
    <canvas id="fog-back" class="landing-fog landing-fog--back"></canvas>
    <canvas id="smoke-back" class="landing-smoke landing-smoke--back" data-sprite="{% static 'images/smoke.png' %}"></canvas>
    <canvas id="ash-back" class="landing-ash landing-ash--back" data-sprite="{% static 'images/ash.png' %}"></canvas>
    <div class="landing-flare"></div>
    <div class="landing-character-aura"></div>
    <img
      class="landing-character"
      src="{% static 'images/character.png' %}?v=6"
      alt=""
      width="1536"
      height="1024"
      draggable="false"
    >
    <canvas id="fog-front" class="landing-fog landing-fog--front"></canvas>
    <canvas id="smoke-front" class="landing-smoke landing-smoke--front" data-sprite="{% static 'images/smoke.png' %}"></canvas>
    <canvas id="ash-front" class="landing-ash landing-ash--front" data-sprite="{% static 'images/ash.png' %}"></canvas>
  </div>
  <div class="landing-vignette"></div>
</div>
