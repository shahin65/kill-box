{% load static %}
{% if card.href %}
<a class="event-card{% if card.live %} is-live{% endif %}" href="{{ card.href }}" data-kb-nav data-event-start="{{ card.start_iso }}" data-wait-status="{{ card.wait_status }}" data-live-status="{{ card.live_status }}">
{% else %}
<article class="event-card{% if card.live %} is-live{% endif %}{% if card.demo %} is-demo{% endif %}" data-event-start="{{ card.start_iso }}" data-wait-status="{{ card.wait_status }}" data-live-status="{{ card.live_status }}">
{% endif %}
  <div class="event-card__stage">
    <div class="event-card__art">
      <img class="event-card__frame" src="{% static card.frame_src %}?v=1" alt="" width="960" height="519" draggable="false">
      <div class="event-card__meta">
        <p class="event-card__status">
          <span class="event-card__live-dot" aria-hidden="true"></span>
          <span data-event-status>{{ card.status }}</span>
        </p>
        <p class="event-card__timer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm1 5h-2v6l4.5 2.7 1-1.7-3.5-2V7z"/></svg>
          <span data-event-timer dir="ltr">۰۰:۰۰:۰۰</span>
        </p>
      </div>
      <div class="event-card__hud">
        <p class="event-glass event-glass--name">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 0 1 6.36 15.36l-1.41-1.41A7 7 0 1 0 7.05 16.95l-1.41 1.41A9 9 0 0 1 12 3zm0 4a5 5 0 0 1 3.54 8.54l-1.42-1.42A3 3 0 1 0 9.88 14.12L8.46 15.54A5 5 0 0 1 12 7z"/></svg>
          <span>{{ card.name }}</span>
        </p>
        <p class="event-glass event-glass--date">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 2a1 1 0 0 1 1 1v1h6V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1zm11 8H5v9h14V10z"/></svg>
          <span>{{ card.date_label }}</span>
        </p>
        {% if card.kind == 'live' %}
        <p class="event-glass event-glass--time">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm1 5h-2v6l4.5 2.7 1-1.7-3.5-2V7z"/></svg>
          <span dir="ltr">{{ card.time_label }}</span>
        </p>
        {% else %}
        <p class="event-glass event-glass--cap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.5 7a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm8 1a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 18.2C3 15.9 6.1 14 8.5 14s5.5 1.9 5.5 4.2V20H3v-1.8z"/></svg>
          <span dir="ltr">{{ card.capacity }}</span>
        </p>
        <div class="event-card__pay">
          <p class="event-glass event-glass--prize">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h10v2h3a2 2 0 0 1 2 2c0 3.2-2.1 5.8-5.1 6.6A5 5 0 0 1 13 16.9V18h3v2H8v-2h3v-1.1A5 5 0 0 1 7.1 13.6C4.1 12.8 2 10.2 2 7a2 2 0 0 1 2-2h3V3z"/></svg>
            <span>{{ card.prize }}</span>
          </p>
          <button class="event-fee-btn" type="button" disabled title="نمایشی">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 1 0 0 4v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2 2 0 1 0 0-4V6z"/></svg>
            <span>{{ card.fee }}</span>
          </button>
        </div>
        {% endif %}
      </div>
      <div class="event-card__char-stack">
        <div class="event-card__char-breath">
          <span class="event-card__char-glow" aria-hidden="true"></span>
          <div class="event-card__char-figure">
            <img class="event-card__char" src="{% static card.char_src %}?v=2" alt="" width="780" height="984" draggable="false">
          </div>
        </div>
      </div>
    </div>
  </div>
{% if card.href %}
</a>
{% else %}
</article>
{% endif %}
