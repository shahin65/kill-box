{% load static %}
{% url 'core:profile' as profile_url %}
{% url 'shop:hub' as shop_url %}
<div class="topbar-hud">
  {% if request.path == profile_url %}
  <span class="topbar-profile is-current" title="پروفایل">
  {% else %}
  <a class="topbar-profile" href="{{ profile_url }}" data-kb-nav title="پروفایل">
  {% endif %}
    <img
      class="{% if has_custom_avatar %}is-custom{% endif %}"
      src="{% if avatar_url %}{{ avatar_url }}{% else %}{% static 'images/icons/profile2.webp' %}?v=2{% endif %}"
      alt="پروفایل"
      width="256"
      height="256"
    >
  {% if request.path == profile_url %}
  </span>
  {% else %}
  </a>
  {% endif %}
  <a class="topbar-chip topbar-chip--gem" href="{{ shop_url }}" data-kb-nav title="جم">
    <img src="{% static 'images/icons/gem.webp' %}?v=2" alt="" width="128" height="128">
    <span class="topbar-chip__meta">
      <small>تعداد جم :</small>
      <b dir="ltr">{{ gems }}</b>
    </span>
  </a>
</div>
