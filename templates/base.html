{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a07">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}KILLBOX{% endblock %}</title>
  <link rel="icon" href="{% static 'images/favicon.ico' %}?v=1" sizes="any">
  <link rel="icon" type="image/png" href="{% static 'images/favicon-32.png' %}?v=1" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}?v=5">
  <link rel="stylesheet" href="{% static 'css/landing.css' %}?v=55">
  <link rel="stylesheet" href="{% static 'css/social.css' %}?v=19">
  <link rel="stylesheet" href="{% static 'css/arena.css' %}?v=7">
  {% block extra_css %}{% endblock %}
  <script>
  (function () {
    var allowed = { classic: 1, glass: 1, neon: 1, carbon: 1 };
    var art = '';
    try {
      art = localStorage.getItem('killbox-art-style') || '';
    } catch (err) {
      art = '';
    }
    if (allowed[art]) {
      document.documentElement.setAttribute('data-art', art);
    }
  })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
  <div id="google_translate_element" hidden></div>
  <script>
  (function (win, doc) {
    if (win.__kbNav) {
      return;
    }
    win.__kbNav = true;

    var busy = false;

    function absUrl(href) {
      try {
        return new URL(href, win.location.href);
      } catch (err) {
        return null;
      }
    }

    function pathOf(url) {
      return String((url && url.pathname) || '/').replace(/\/+$/, '') || '/';
    }

    function searchOf(url) {
      var search = String((url && url.search) || '');
      return search === '?' ? '' : search;
    }

    function hereKey() {
      return pathOf(win.location) + searchOf(win.location);
    }

    function destKey(url) {
      return pathOf(url) + searchOf(url);
    }

    function isHere(url) {
      return !!url && destKey(url) === hereKey();
    }

    function canSwap(url) {
      var path = pathOf(url);
      if (path.indexOf('/admin') === 0) {
        return false;
      }
      if (path.indexOf('/dev-lab') === 0) {
        return false;
      }
      return true;
    }

    function hardGo(url) {
      try {
        win.location.assign(url.href);
      } catch (err) {}
    }

    function copyBodyState(fromBody, toBody) {
      toBody.className = fromBody.className;
      ['data-intro', 'data-admitted', 'data-home'].forEach(function (name) {
        if (fromBody.hasAttribute(name)) {
          toBody.setAttribute(name, fromBody.getAttribute(name));
        } else {
          toBody.removeAttribute(name);
        }
      });
    }

    function applyShell(html, url, push) {
      var parsed = new DOMParser().parseFromString(html, 'text/html');
      var next = parsed.getElementById('kb-shell');
      var shell = doc.getElementById('kb-shell');
      if (!next || !shell) {
        hardGo(url);
        return;
      }
      shell.replaceWith(next);
      doc.title = parsed.title || doc.title;
      copyBodyState(parsed.body, doc.body);
      if (push) {
        if (!win.__kbHist) {
          win.history.replaceState({ kbNav: 1 }, '', win.location.href);
          win.__kbHist = true;
        }
        win.history.pushState({ kbNav: 1 }, '', url.href);
      }
      if (typeof win.__kbBindPage === 'function') {
        win.__kbBindPage();
      }
    }

    function loadShell(url, push) {
      if (busy) {
        return true;
      }
      busy = true;
      fetch(url.href, {
        credentials: 'same-origin',
        headers: { Accept: 'text/html' },
      })
        .then(function (res) {
          if (!res.ok) {
            throw new Error('nav');
          }
          return res.text();
        })
        .then(function (html) {
          applyShell(html, url, push);
        })
        .catch(function () {
          hardGo(url);
        })
        .then(function () {
          busy = false;
        });
      return true;
    }

    function forceGo(href) {
      var url = absUrl(href);
      if (!url || url.origin !== win.location.origin) {
        return false;
      }
      if (url.protocol !== 'http:' && url.protocol !== 'https:') {
        return false;
      }
      if (isHere(url)) {
        return false;
      }
      if (!canSwap(url)) {
        hardGo(url);
        return true;
      }
      return loadShell(url, true);
    }

    function closestControl(node) {
      if (!node || typeof node.closest !== 'function') {
        return null;
      }
      return node.closest('button, label, input, textarea, select, summary, [data-rank-open], [data-avatar-open], [download], .profile-avatar-edit, .profile-avatar-upload');
    }

    function hrefFrom(node) {
      if (!node || typeof node.closest !== 'function') {
        return '';
      }
      if (closestControl(node)) {
        return '';
      }
      var nav = node.closest('a[href], [data-kb-nav]');
      if (!nav || nav.hasAttribute('download')) {
        return '';
      }
      if (nav.target && nav.target !== '_self') {
        return '';
      }
      var href = nav.getAttribute('href') || nav.getAttribute('data-kb-nav') || '';
      if (!href || href === '#' || href.charAt(0) === '#' || href.indexOf('javascript:') === 0) {
        return '';
      }
      return href;
    }

    function onActivate(event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }
      if (typeof event.button === 'number' && event.button !== 0) {
        return;
      }
      var node = event.target;
      if (node && node.nodeType !== 1) {
        node = node.parentElement;
      }
      if (closestControl(node)) {
        return;
      }
      var href = hrefFrom(node);
      if (!href) {
        return;
      }
      var url = absUrl(href);
      if (!url || url.origin !== win.location.origin) {
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      if (isHere(url)) {
        return;
      }
      forceGo(href);
    }

    win.__kbGo = forceGo;
    win.__kbSoftReload = function () {
      var url = absUrl(win.location.href);
      if (!url) {
        return;
      }
      loadShell(url, false);
    };
    win.addEventListener('popstate', function () {
      var url = absUrl(win.location.href);
      if (!url || !canSwap(url)) {
        return;
      }
      loadShell(url, false);
    });
    doc.addEventListener('click', onActivate, true);
  })(window, document);
  </script>
  {% block scene %}
    {% include "core/_scene.html" %}
  {% endblock %}
  <div id="kb-shell">
    {% block body %}{% endblock %}
  </div>
  {% block extra_js %}
  <script src="{% static 'js/particles.js' %}?v=17" defer></script>
  <script src="{% static 'js/landing.js' %}?v=41" defer></script>
  <script src="{% static 'js/social.js' %}?v=8" defer></script>
  <script src="{% static 'js/live.js' %}?v=2" defer></script>
  {% endblock %}
  <script src="{% static 'js/translate.js' %}?v=2" defer></script>
</body>
</html>
