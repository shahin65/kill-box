<div class="kb-gif-sheet" id="kb-gif-sheet" hidden role="dialog" aria-modal="true" aria-label="انتخاب GIF">
  <div class="kb-gif-sheet__backdrop" data-gif-close></div>
  <div class="kb-gif-sheet__panel">
    <header class="kb-gif-sheet__head">
      <input id="kb-gif-q" type="search" maxlength="80" placeholder="جست‌وجوی GIF" autocomplete="off" enterkeyhint="search">
      <button class="story-act" type="button" data-gif-close>بستن</button>
    </header>
    <div class="kb-gif-grid" id="kb-gif-grid"></div>
    <p class="kb-gif-status" id="kb-gif-status" hidden></p>
    <button class="auth-btn" id="kb-gif-more" type="button" hidden>بیشتر</button>
  </div>
</div>
