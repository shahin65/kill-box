{% load static %}
{{ story_groups|json_script:"story-data" }}
<dialog class="story-viewer" id="story-viewer">
  <div class="story-viewer__backdrop" data-story-close></div>
  <div class="story-viewer__frame">
    <div class="story-viewer__chrome">
      <div class="story-viewer__bars" id="story-bars"></div>
      <div class="story-viewer__top">
        <div class="story-viewer__user" id="story-user">
          <img id="story-user-avatar" src="{% static 'images/icons/profile2.webp' %}" data-fallback="{% static 'images/icons/profile2.webp' %}" alt="" width="40" height="40">
          <strong id="story-user-name"></strong>
        </div>
        <button class="story-viewer__icon" type="button" id="story-views" data-story-viewers hidden title="بینندگان">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c5 0 9.3 3.1 11 7-1.7 3.9-6 7-11 7S2.7 15.9 1 12c1.7-3.9 6-7 11-7zm0 3.2A3.8 3.8 0 1 0 15.8 12 3.8 3.8 0 0 0 12 8.2z"/></svg>
          <span id="story-view-count">0</span>
        </button>
        <button class="story-viewer__icon" type="button" data-story-close title="بستن">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
        </button>
      </div>
    </div>
    <div class="story-viewer__stage" id="story-stage"></div>
    <p class="story-viewer__overlay" id="story-overlay-text"></p>
    <div class="story-viewer__actions">
      <button class="story-viewer__icon is-like" type="button" id="story-like" title="لایک">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 20.4 10.6 19C5.4 14.4 2 11.4 2 7.9A4.8 4.8 0 0 1 6.9 3 5.4 5.4 0 0 1 12 5.7 5.4 5.4 0 0 1 17.1 3 4.8 4.8 0 0 1 22 7.9c0 3.5-3.4 6.5-8.6 11.1z"/></svg>
        <span id="story-like-count">0</span>
      </button>
      <form class="story-viewer__comment" id="story-comment-form">
        <input id="story-comment" type="text" maxlength="280" placeholder="کامنت…">
        <button class="story-viewer__icon" type="submit" title="ارسال">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 20.5 21 12 3 3.5v6.6L15 12 3 13.9z"/></svg>
        </button>
      </form>
    </div>
    <div class="story-viewer__comments" id="story-comments"></div>
    <div class="kb-viewers" id="story-viewers" hidden>
      <div class="kb-viewers__head">
        <strong>بینندگان</strong>
        <button class="story-act" type="button" data-viewers-close>بستن</button>
      </div>
      <div class="kb-viewers__list" id="story-viewers-list"></div>
      <button class="auth-btn" type="button" id="story-viewers-more" hidden>بیشتر</button>
    </div>
  </div>
</dialog>
