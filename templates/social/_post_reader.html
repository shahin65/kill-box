<dialog class="post-reader" id="post-reader">
  <button class="post-reader__close" type="button" data-post-close title="بستن">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
    <span class="visually-hidden">بستن</span>
  </button>
  <div class="post-reader__stage" id="post-reader-stage"></div>
  <div class="post-reader__nav">
    <button class="post-reader__nav-btn" type="button" data-post-reader-prev>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.8 5.2 8 12l6.8 6.8 1.4-1.4L10.8 12l5.4-5.4z"/></svg>
      <span>پست قبلی</span>
    </button>
    <button class="post-reader__nav-btn" type="button" data-post-reader-next>
      <span>پست بعدی</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m9.2 5.2-1.4 1.4L13.2 12l-5.4 5.4 1.4 1.4L16 12z"/></svg>
    </button>
  </div>
</dialog>
