<dialog class="post-reader" id="post-reader">
  <button class="story-viewer__icon post-reader__close" type="button" data-post-close title="بستن">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
    <span class="visually-hidden">بستن</span>
  </button>
  <div class="post-reader__feed" id="post-reader-stage" data-kb-reels></div>
  <div class="post-reader__nav">
    <button class="post-reader__nav-btn" type="button" data-post-reader-prev>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8.6 18.4 15l-1.4 1.4L12 11.4 7 16.4 5.6 15z"/></svg>
      <span>پست قبلی</span>
    </button>
    <button class="post-reader__nav-btn" type="button" data-post-reader-next>
      <span>پست بعدی</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 15.4-6.4-6.4L7 7.6l5 5 5-5 1.4 1.4z"/></svg>
    </button>
  </div>
</dialog>
